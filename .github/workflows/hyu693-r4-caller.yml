name: HYU693 Round 4 caller control
on:
  push:
    paths:
      - .github/workflows/hyu693-r4-caller.yml
permissions:
  actions: read
jobs:
  probe:
    name: caller-control-probe
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TOKEN_CONTEXT: ${{ github.token }}
      API: https://api.github.com
      CONTROL_RUN: '34777143923'
      CONTROL_JOB: '103777217268'
      CONTROL_ARTIFACT: '10324166927'
      CALLER_HASH: 32108f044b84b3c321d6ead925336d174e84cda908257576ce27bbb4e1cea8c6
    steps:
      - name: Verify current-repository artifact and log
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hyu693-r4-control"
          mkdir -p "$work"
          auth_args=(
            -H "Authorization: Bearer ${TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          request_json() {
            local label="$1" url="$2" out="$3" status
            status=$(curl -sS --max-redirs 0 -o "$out" -w '%{http_code}' "${auth_args[@]}" "$url")
            printf '%s_status=%s\n' "$label" "$status"
          }

          request_download() {
            local label="$1" url="$2" kind="$3" expected_hash="$4" expected_file="$5" prefix="$6"
            local headers="$work/${label}.headers" first="$work/${label}.first" final="$work/${label}.final" markers="$work/${label}.markers"
            local status location final_status location_present=false observed_hash=none marker_match=false marker_count=0 entry_count=0 name_match=false marker
            status=$(curl -sS --max-redirs 0 -D "$headers" -o "$first" -w '%{http_code}' "${auth_args[@]}" "$url")
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")
            if [ -n "$location" ]; then location_present=true; fi
            printf '%s_api_status=%s\n' "$label" "$status"
            printf '%s_signed_location=%s\n' "$label" "$location_present"
            if [ "$status" = 302 ] && [ -n "$location" ]; then
              final_status=$(curl -sS --max-redirs 0 -o "$final" -w '%{http_code}' "$location")
            elif [ "$status" = 200 ]; then
              cp "$first" "$final"
              final_status=200
            else
              printf '%s_final_status=none\n' "$label"
              printf '%s_marker_match=false\n' "$label"
              return
            fi
            printf '%s_final_status=%s\n' "$label" "$final_status"
            if [ "$final_status" != 200 ]; then
              printf '%s_marker_match=false\n' "$label"
              return
            fi
            if [ "$kind" = artifact ]; then
              entry_count=$(unzip -Z1 "$final" 2>/dev/null | wc -l | tr -d ' ')
              if [ "$entry_count" = 1 ] && unzip -Z1 "$final" 2>/dev/null | grep -Fxq "$expected_file"; then name_match=true; fi
              observed_hash=$(unzip -p "$final" "$expected_file" 2>/dev/null | sha256sum | cut -d' ' -f1)
              if [ "$observed_hash" = "$expected_hash" ]; then marker_match=true; fi
              printf '%s_entry_count=%s\n' "$label" "$entry_count"
              printf '%s_name_match=%s\n' "$label" "$name_match"
            else
              grep -aoE "${prefix}_[a-f0-9]{32}" "$final" | sort -u > "$markers" || true
              marker_count=$(wc -l < "$markers" | tr -d ' ')
              while IFS= read -r marker; do
                [ -n "$marker" ] || continue
                observed_hash=$(printf '%s' "$marker" | sha256sum | cut -d' ' -f1)
                if [ "$observed_hash" = "$expected_hash" ]; then marker_match=true; break; fi
              done < "$markers"
              printf '%s_marker_count=%s\n' "$label" "$marker_count"
            fi
            printf '%s_final_size=%s\n' "$label" "$(wc -c < "$final" | tr -d ' ')"
            printf '%s_marker_sha256=%s\n' "$label" "$observed_hash"
            printf '%s_marker_match=%s\n' "$label" "$marker_match"
          }

          token_equals_context=false
          if [ "$TOKEN" = "$TOKEN_CONTEXT" ]; then token_equals_context=true; fi
          printf 'job_repository=%s\n' "$GITHUB_REPOSITORY"
          printf 'job_repository_id=%s\n' "$GITHUB_REPOSITORY_ID"
          printf 'token_equals_github_context=%s\n' "$token_equals_context"
          printf 'caller_control_run_id=%s\n' "$CONTROL_RUN"
          printf 'caller_control_job_id=%s\n' "$CONTROL_JOB"
          printf 'caller_control_artifact_id=%s\n' "$CONTROL_ARTIFACT"

          request_json caller_artifact_metadata "$API/repos/bshyuunn/sum-test/actions/artifacts/$CONTROL_ARTIFACT" "$work/metadata.json"
          request_download caller_artifact "$API/repos/bshyuunn/sum-test/actions/artifacts/$CONTROL_ARTIFACT/zip" artifact "$CALLER_HASH" hyu693-r4-caller-marker.txt HYU693C
          request_download caller_job_log "$API/repos/bshyuunn/sum-test/actions/jobs/$CONTROL_JOB/logs" joblog "$CALLER_HASH" unused HYU693C
